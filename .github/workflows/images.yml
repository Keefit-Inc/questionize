name: Images

# Builds and pushes the app and AI service images to GHCR on every push to main.
# Deploy one with: bin/kamal deploy --skip-push --version <commit sha>   (from api/)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Kamal manages (and prunes) images labeled with its service name, so only the app
          # image carries the label; the AI accessory image must not, or pruning tries to delete it.
          - name: questionize
            context: .
            dockerfile: api/Dockerfile
            labels: service=questionize
          - name: questionize-ai
            context: ai
            dockerfile: ai/Dockerfile
            labels: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Kamal names app images by the full commit sha.
          tags: |
            ghcr.io/keefit-inc/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/keefit-inc/${{ matrix.name }}:latest
          labels: ${{ matrix.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

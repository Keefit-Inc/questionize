<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Questionize</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">Q</span>
        <span class="name">Questionize</span>
      </div>
      <button id="settings-toggle" class="icon-btn" title="Settings" aria-expanded="false" aria-controls="settings">⚙</button>
    </header>

    <section id="settings" class="settings" hidden>
      <label class="field">
        <span>Server URL</span>
        <input id="server-url" type="url" placeholder="http://localhost:8000" />
      </label>
      <label class="field">
        <span>Dev token (INTERNAL_TOKEN)</span>
        <input id="dev-token" type="password" autocomplete="off" />
      </label>
      <p id="server-status" class="hint"></p>
    </section>

    <section class="controls">
      <div class="source" id="source">
        <span class="source-label">Reading</span>
        <span class="source-title" id="source-title">Open an article, then generate.</span>
        <span class="source-sel" id="source-sel" hidden></span>
      </div>

      <fieldset class="types">
        <legend>Question types</legend>
        <label class="chip"><input type="checkbox" name="type" value="CR" checked /><span>Critical Reasoning</span></label>
        <label class="chip"><input type="checkbox" name="type" value="RC" checked /><span>Reading Comp</span></label>
      </fieldset>

      <div class="row">
        <label class="field compact">
          <span>Difficulty</span>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label class="field compact">
          <span>Per type</span>
          <select id="count">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
      </div>

      <button id="generate" class="primary">Questionize this page</button>
    </section>

    <section id="progress" class="progress" hidden aria-live="polite">
      <ol id="progress-log"></ol>
    </section>

    <section id="error" class="error" hidden role="alert"></section>

    <section id="questions" class="questions"></section>

    <footer class="stats" id="stats" hidden></footer>

    <template id="question-tpl">
      <article class="card">
        <header class="card-head">
          <span class="tag type"></span>
          <span class="tag subtype"></span>
          <span class="badge"></span>
        </header>
        <div class="passage"></div>
        <p class="stem"></p>
        <ol class="choices"></ol>
        <div class="actions">
          <button class="check primary" disabled>Check answer</button>
          <button class="locate ghost" hidden>Show in article</button>
        </div>
        <div class="reveal" hidden>
          <p class="verdict"></p>
          <p class="explanation"></p>
          <details class="rationales">
            <summary>Why each option is right or wrong</summary>
            <ol></ol>
          </details>
          <details class="verification">
            <summary>How this question was verified</summary>
            <div class="verify-body"></div>
          </details>
        </div>
      </article>
    </template>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
